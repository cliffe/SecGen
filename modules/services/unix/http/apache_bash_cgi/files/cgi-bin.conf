# Serve /usr/lib/cgi-bin as /cgi-bin/ (the puppetlabs apache module's default
# vhost is disabled and its vhosts define no ScriptAlias). mod_cgi is loaded by
# the apache module under prefork.
ScriptAlias /cgi-bin/ /usr/lib/cgi-bin/
<Directory "/usr/lib/cgi-bin">
  AllowOverride None
  Options +ExecCGI -MultiViews +SymLinksIfOwnerMatch
  Require all granted
</Directory>
