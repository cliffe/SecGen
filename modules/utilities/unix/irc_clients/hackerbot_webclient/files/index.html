<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Hackerbot</title>
<style>
  body { font-family: sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; background: #1e1e1e; color: #ddd; }
  #main { flex: 1; display: flex; min-height: 0; }
  #chatarea { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #log { flex: 1; overflow-y: auto; padding: 1em; }
  #log p { margin: 0 0 0.5em 0; white-space: pre-wrap; }
  #log .me { color: #7ec4ff; }
  #log .bot { color: #9dff9d; }
  #log .status { color: #888; font-style: italic; }

  #sidebar { width: 190px; flex: none; border-left: 1px solid #3a3a3a; background: #232323; overflow-y: auto; }
  .histitem { padding: 0.6em 0.8em; cursor: pointer; border-bottom: 1px solid #2c2c2c; font-size: 0.9em; }
  .histitem:hover { background: #2e2e2e; }
  .histitem.active { background: #3a3a3a; color: #fff; font-weight: bold; }

  form { display: flex; padding: 0.5em; background: #2a2a2a; position: relative; gap: 0.4em; }
  input { flex: 1; padding: 0.5em; font-size: 1em; }
  button { padding: 0.5em 1em; font-size: 1em; }
  button:disabled, input:disabled { opacity: 0.5; }

  #cmdPopup { position: absolute; right: 0.5em; bottom: 3em; background: #2f2f2f; border: 1px solid #444; border-radius: 4px; flex-direction: column; overflow: hidden; }
  #cmdPopup:not([hidden]) { display: flex; }
  #cmdPopup button { text-align: left; background: none; border: none; color: #ddd; padding: 0.5em 1em; cursor: pointer; }
  #cmdPopup button:hover { background: #3f3f3f; }

  .flagspan { background: #3a3a1e; border-radius: 3px; padding: 0 0.2em; }
  .copybtn { background: none; border: none; cursor: pointer; opacity: 0; padding: 0 0.2em; font-size: 0.9em; }
  .flagspan:hover .copybtn { opacity: 1; }
</style>
</head>
<body>
<div id="main">
  <div id="chatarea">
    <div id="log"></div>
    <form id="f">
      <input id="msg" autocomplete="off" autofocus>
      <button type="button" id="cmdBtn" title="Common commands">...</button>
      <div id="cmdPopup" hidden></div>
      <button type="submit" id="sendBtn">Send</button>
    </form>
  </div>
  <div id="sidebar"></div>
</div>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
