# SecGen webdav_file_upload_cgi: run scripts uploaded into the writable WebDAV
# collection as CGI, without the uploaded file needing the execute bit.
#
# A plain mod_cgi "cgi-script" handler would require every uploaded script to be
# executable, but a file written by an unauthenticated WebDAV PUT is mode 0644.
# Instead this uses mod_actions: any .cgi/.pl/.sh/.py under /var/www/webdav is
# handed to the installed dispatcher CGI (/secgen-dav-cgi-bin/dispatch), which
# runs it through the interpreter named in its #! line. So an attacker who can
# PUT a script with a shebang gets code execution as the Apache user.
#
# apache_webdav_upload declares a plain <Directory /var/www/webdav/...> block in
# its vhost. Apache merges <DirectoryMatch> sections AFTER all plain <Directory>
# sections, so "Options +ExecCGI" here is layered on top of the vhost's Options
# and survives the merge. Matching the docroot (not the randomised collection
# subpath) keeps this decoupled from the collection's webdav_path input.

# The dispatcher itself is a real, executable CGI served from its own directory.
ScriptAlias /secgen-dav-cgi-bin/ /usr/lib/secgen-dav-cgi-bin/
<Directory "/usr/lib/secgen-dav-cgi-bin">
    AllowOverride None
    Options +ExecCGI
    Require all granted
</Directory>

<DirectoryMatch "^/var/www/webdav">
    Options +ExecCGI -MultiViews +FollowSymLinks
    AddHandler secgen-dav-cgi .cgi .pl .sh .py
    Action secgen-dav-cgi /secgen-dav-cgi-bin/dispatch
    Require all granted
</DirectoryMatch>
